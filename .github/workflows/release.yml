# A push to develop or main builds CBC Tutor and publishes a GitHub release.
#
# Android updates install over the previous copy only when these repository
# secrets are set (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64     base64 of the .keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them, each release is signed with a new key. The phone must
# uninstall the old app before the new one will install.

name: Release

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      # Optional code signing through SSL.com eSigner (client/scripts/sign-windows.ps1). With
      # secrets ESIGNER_USERNAME, ESIGNER_PASSWORD, ESIGNER_CREDENTIAL_ID and ESIGNER_TOTP_SECRET
      # set, the exe, setup.exe and .msi are signed; without them the build is unsigned.
      - name: Set up Windows code signing
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          SIGN: ${{ secrets.ESIGNER_CREDENTIAL_ID != '' }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "codesigntool"
          Invoke-WebRequest "https://www.ssl.com/download/codesigntool-for-windows/" -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" -DestinationPath $dir
          $bat = Get-ChildItem $dir -Recurse -Filter CodeSignTool.bat | Select-Object -First 1
          if (-not $bat) { throw "CodeSignTool.bat is not in the download" }
          "CODESIGNTOOL_DIR=$($bat.DirectoryName)" >> $env:GITHUB_ENV
          $script = Join-Path $env:GITHUB_WORKSPACE "client/scripts/sign-windows.ps1"
          @{ bundle = @{ windows = @{ signCommand = @{
            cmd = "pwsh"; args = @("-NoProfile", "-File", $script, "%1")
          } } } } | ConvertTo-Json -Depth 6 | Set-Content client/src-tauri/tauri.windows.conf.json

      - name: Build installers
        working-directory: client
        run: npx tauri build --bundles nsis,msi
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}

      - uses: actions/upload-artifact@v4
        with:
          name: cbc-windows
          if-no-files-found: error
          path: |
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/src-tauri/target/release/bundle/msi/*.msi

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build installer
        working-directory: client
        run: npx tauri build --bundles deb

      - uses: actions/upload-artifact@v4
        with:
          name: cbc-linux
          if-no-files-found: error
          path: client/src-tauri/target/release/bundle/deb/*.deb

  android:
    name: Android
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      signing: ${{ steps.sign.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install the Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build the APK
        working-directory: client
        run: npx tauri android build --apk --target aarch64

      - name: Sign the APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk=$(find client/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)
          mkdir -p android-out
          "$bt/zipalign" -p -f 4 "$apk" android-out/aligned.apk
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android-out/release.keystore
            "$bt/apksigner" sign --ks android-out/release.keystore \
              --ks-pass "pass:${STORE_PASS}" --ks-key-alias "${KEY_ALIAS}" \
              --key-pass "pass:${KEY_PASS}" --out android-out/CBC-Tutor-arm64.apk android-out/aligned.apk
            echo "mode=repository keystore" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -keystore android-out/ci.keystore -storepass android -keypass android \
              -alias cibuild -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CBC Tutor CI, O=CBC Tutor, C=KE"
            "$bt/apksigner" sign --ks android-out/ci.keystore --ks-pass pass:android \
              --ks-key-alias cibuild --key-pass pass:android \
              --out android-out/CBC-Tutor-arm64.apk android-out/aligned.apk
            echo "mode=a new key for this release only" >> "$GITHUB_OUTPUT"
          fi
          rm -f android-out/aligned.apk android-out/release.keystore android-out/ci.keystore android-out/*.idsig

      - uses: actions/upload-artifact@v4
        with:
          name: cbc-android
          if-no-files-found: error
          path: android-out/CBC-Tutor-arm64.apk

  publish:
    name: Publish release
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release name
        id: ver
        run: |
          version=$(python3 -c "import json; print(json.load(open('client/src-tauri/tauri.conf.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: cbc-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: CBC Tutor ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.deb
            dist/**/*.apk
          body: |
            Installers for ${{ github.sha }}.

            The Android package was signed with ${{ needs.android.outputs.signing }}.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
