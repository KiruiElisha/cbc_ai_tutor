# Server tests on a fresh Frappe v16 bench with ERPNext and Education, which this app needs.
# Frappe v16 needs Python 3.14 and Node 24.
name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: App (Svelte and Rust)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - name: System libraries for the Tauri tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Svelte check and build
        working-directory: client
        run: |
          npm ci
          npm run check
          npm run build
          npm test
      - name: Rust tests
        working-directory: client/src-tauri
        run: cargo test

  server:
    name: Server
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bench with ERPNext and Education
        run: |
          sudo apt-get update && sudo apt-get install -y mariadb-client
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          cd ~/frappe-bench
          bench get-app --branch version-16 --skip-assets erpnext
          bench get-app --branch version-16 --skip-assets education
          bench get-app --skip-assets cbc_ai_tutor "$GITHUB_WORKSPACE"
          bench setup requirements --dev
        env:
          CI: "Yes"

      - name: Site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin --db-host 127.0.0.1 test_site
          bench --site test_site install-app erpnext education cbc_ai_tutor
          bench --site test_site set-config allow_tests true

      - name: Tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app cbc_ai_tutor
